# ReThink hardware options, applied to every rethink_* shield.
#
# ZMK picks this file up for any shield whose name starts with "rethink_".
# Each option matches a solder jumper or a fitted part. The values below are
# the defaults of a stock adapter and Control Board; change the lines that
# differ on yours. In each choice group exactly one line is set to y.
# Details: menuconfig (ReThink keyboard > Hardware options) and
# ReThink_keyboard docs/pinouts/io_expander.md.

# --- Adapter: PCAL6416A supply (JP10) ---
# 1-2 LED_3V3, always on (default)
CONFIG_RETHINK_EXPANDER_SUPPLY_LED_3V3=y
# 2-3 TP_3V3, switched by the Control Board (P3.12)
# CONFIG_RETHINK_EXPANDER_SUPPLY_TP_3V3=y

# --- Adapter: charge pump enable (JP1) ---
# Closed: the pump runs whenever TP_3V3 is on; PUMP_EN is not driven
CONFIG_RETHINK_PUMP_EN_TIED=n

# --- Adapter: backlight boost (U4, JP2) ---
# n on the Mezz_no_BL and FFC1 variants (U4 not fitted)
CONFIG_RETHINK_BOOST_FITTED=y
# JP2 closed: the boost runs whenever VLED_BL is on; BOOST_EN is not driven
CONFIG_RETHINK_BOOST_EN_TIED=n
# JP3 (BL_5V to Mezzanine pin 29) has no firmware option: close it only for
# a backlit T430/T530/W530/X230. On older Mezzanine keyboards pin 29 is
# KBDID2, which may be grounded.

# --- Control Board: VLED_BL source ---
# R62 fitted: nPM1300 BUCK1, 3.3 V, up to 200 mA (default)
CONFIG_RETHINK_BACKLIGHT_SUPPLY_BUCK1=y
# R59 fitted, R62 removed: battery (VBAT). No backlight without a battery.
# CONFIG_RETHINK_BACKLIGHT_SUPPLY_VBAT=y
# nPM1300 VSYS (expected on the next Control Board revision): USB or battery
# CONFIG_RETHINK_BACKLIGHT_SUPPLY_VSYS=y

# PWM duty cycle at full brightness, 1-10 %, default 10. Capped until real
# keyboard backlights are measured (a T470 draws about 600 mA at 80 %).
# CONFIG_RETHINK_BACKLIGHT_MAX_DUTY=10

# --- Control Board: bootloader ---
# The factory MCUboot only checks the pairing button after a power-on reset
# (fixed in Framework's MCUboot, daisy branch, 2026-10-16). y: the 10 s
# recovery hold power-cycles the board through the nPM1300. n: soft reset,
# for boards with a newer bootloader.
CONFIG_RETHINK_MCUBOOT_NEEDS_POWER_CYCLE=y

# --- Adapter: Mezzanine/FFC1 pointing stick supply (JP6, with JP4/JP5) ---
# Read by the TrackPoint support (not implemented yet).
# 1-2 5 V charge pump, level shifter (default)
CONFIG_RETHINK_TP1_SUPPLY_5V=y
# 2-3 TP_3V3, level shifter bypassed
# CONFIG_RETHINK_TP1_SUPPLY_3V3=y

# --- Adapter: FFC2 pointing stick supply (JP7, with JP8/JP9) ---
# 1-2 TP_3V3, level shifter bypassed (default)
CONFIG_RETHINK_TP2_SUPPLY_3V3=y
# 2-3 5 V charge pump, level shifter
# CONFIG_RETHINK_TP2_SUPPLY_5V=y

# --- Adapter: FFC2 pointing stick reset resistor ---
# R22 pull-up, held in reset until released (default)
CONFIG_RETHINK_TP2_RESET_PULL_UP=y
# R23 pull-down instead
# CONFIG_RETHINK_TP2_RESET_PULL_DOWN=y
