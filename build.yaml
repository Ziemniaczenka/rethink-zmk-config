# Build matrix for .github/workflows/build.yml. Each entry runs scripts/build.sh
# with BOARD, SHIELD and optional SNIPPET.
include:
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_bare_tester
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_bare_tester
    snippet: rethink-usb-log
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_hw_tester
    snippet: rethink-usb-log
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_hw_tester
    snippet: rethink-usb-shell
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_scanner
    snippet: rethink-usb-shell
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_l420
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_l420
    snippet: rethink-usb-log
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_t420
  - board: framework_wireless_tp_kb/nrf54lm20a/cpuapp/zmk
    shield: rethink_t420
    snippet: rethink-usb-log
