# Power profiling from a bench supply into the battery input (README: Idle
# current). The EFM32 kit's 3.3 V reaches the board as 3.24-3.27 V, under the
# default low-battery cut-off (3.3 V): the cut-off at 3.15 V, low enough for
# that supply and still there to try ship mode from a bench supply.
CONFIG_RETHINK_LOW_BATTERY_OFF_MV=3150
