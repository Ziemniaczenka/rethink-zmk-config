# Power profiling from a bench supply into the battery input (docs/roadmap.md:
# Idle current). The EFM32 kit's 3.3 V reaches the board as 3.24-3.27 V and
# sags further under a running stick (about 30 mA with the T420's), under the
# default low-battery cut-off (3.3 V): the cut-off at 3.0 V, low enough for
# that supply and still there to try ship mode from a bench supply. A stick
# needs a reservoir capacitor across the battery input from such a supply
# (docs/power.md: Pointing stick switch-on surge).
CONFIG_RETHINK_LOW_BATTERY_OFF_MV=3000
