# Zephyr shell and logs over a USB CDC ACM port next to the keyboard
# (device_next stack), with the "adapter" bring-up commands. Like
# rethink-usb-log, it takes cdc_acm_uart0 from ZMK Studio.
CONFIG_ZMK_STUDIO=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
# framework-cb's usb_next.c owns the USB device; no second context
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Nothing is sent until a terminal opens the port
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y

# Logs go through the shell, which redraws the prompt after them. ZMK logs at
# debug level whenever logging is on.
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BUFFER_SIZE=8192

CONFIG_RETHINK_ADAPTER_TEST=y
