# Logs over a USB CDC ACM port next to the keyboard (device_next stack).
# Uses cdc_acm_uart0, which ZMK Studio's USB transport also uses, so the two
# are mutually exclusive.
CONFIG_ZMK_STUDIO=n
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
# framework-cb's usb_next.c owns the USB device; no second context
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_ZMK_LOG_LEVEL_DBG=y
