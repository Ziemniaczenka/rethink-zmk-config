# One Bluetooth profile per white LED
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# Lock LEDs follow the host
CONFIG_ZMK_HID_INDICATORS=y

# Backlight on Fn+Space (rethink_backlight.dtsi): low, high, off, as on a
# ThinkPad. Brightness 51 % and 100 % of CONFIG_RETHINK_BACKLIGHT_MAX_DUTY;
# off at boot. KBD_BL_DTCT keeps it locked on a keyboard without one.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_STEP=50
CONFIG_ZMK_BACKLIGHT_BRT_START=1
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
