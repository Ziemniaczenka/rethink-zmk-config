description: |
  ReThink adapter control: brings up the PCAL6416A I/O expander (U1) and owns
  its pins. Other code uses them through include/rethink/adapter.h, or
  register by register through include/rethink/expander.h.

  The expander is optional at runtime and is probed at init. If it does not
  answer, a warning is logged and the board keeps working without it. With
  CONFIG_RETHINK_EXPANDER_SUPPLY_TP_3V3 (JP10 2-3) U1 and its I2C pull-ups
  run from TP_3V3, which is then enabled first.

  Assembly options (jumpers, fitted parts) are Kconfig symbols, set in
  config/rethink.conf. The properties below describe the wiring; shields only
  list the LEDs and detect pin their keyboard has.

compatible: "rethink,adapter-ctrl"

properties:
  expander:
    type: phandle
    required: true
    description: PCAL6416A node (rethink,pcal6416a).

  tp-power-supply:
    type: phandle
    description: Regulator for TP_3V3 (Control Board P3.12).

  power-on-delay-ms:
    type: int
    default: 10
    description: Time between enabling tp-power-supply and probing the expander.

  pump-en-gpios:
    type: phandle-array
    description: |
      LM2775 charge pump enable (TP_5V). Driven low at init, unless
      CONFIG_RETHINK_PUMP_EN_TIED (JP1 closed).

  boost-en-gpios:
    type: phandle-array
    description: |
      TPS610333 backlight boost enable (BL_5V). Driven low at init, unless
      CONFIG_RETHINK_BOOST_EN_TIED (JP2 closed).

  idle-gpios:
    type: phandle-array
    description: |
      Expander pins that nothing else drives, each with the pull it rests on
      (GPIO_PULL_UP or GPIO_PULL_DOWN). Set as inputs at init and before
      System OFF, then the pins of the properties above and below are set up
      as those describe, so the list may include them. A floating input draws
      up to 80 µA. A pin pulled up externally to a supply that can be off
      floats with that supply: give it GPIO_PULL_DOWN (TP1_RST, TP2_RST).
      Leave out pins a jumper may tie to a supply (PUMP_EN, BOOST_EN).

  bl-detect-gpios:
    type: phandle-array
    description: |
      KBD_BL_DTCT. Sampled once at init with the pull-up enabled; low means a
      backlit keyboard is connected. The pull-up then stays on, unless the
      keyboard holds the pin low.

  # Status LED sinks. A lit LED pulls the pin low; an unlit one rests on the
  # pull-up (open-drain emulation: only the direction register changes, one
  # 1-byte write). Pin flags are ignored.
  pwr-led-gpios:
    type: phandle-array
    description: LEDPWR, power LED (Mezzanine) or Fn lock LED (FFC2).

  mute-led-gpios:
    type: phandle-array
    description: LEDMUTE

  micmute-led-gpios:
    type: phandle-array
    description: LEDMICMUTE

  capslock-led-gpios:
    type: phandle-array
    description: LEDCPSLOCK

  numlock-led-gpios:
    type: phandle-array
    description: LEDNUMLOCK (FFC2 keyboards with a numpad)
