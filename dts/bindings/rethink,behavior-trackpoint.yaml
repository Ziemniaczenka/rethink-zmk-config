description: |
  Pointing stick (rethink,trackpoint) from a key: &tp TP_OFF, TP_ON, TP_TOG,
  TP_RECAL, TP_RATE_UP, TP_RATE_DN or TP_PTS_TOG, from
  dt-bindings/rethink/trackpoint.h.
  The stick's thread carries the request out, so the key doesn't wait for
  the stick.

compatible: "rethink,behavior-trackpoint"

include: one_param.yaml
